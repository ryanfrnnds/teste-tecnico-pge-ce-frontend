services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - json-server

  json-server:
    build:
      context: ./json-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
