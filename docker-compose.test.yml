services:
  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Mantém o container rodando para permitir execução interativa
    command: tail -f /dev/null
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - json-server

  json-server:
    build:
      context: ./json-server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

volumes:
  node_modules:
